[package]
name = "librepods-tray"
version = "0.1.0"
edition = "2021"
description = "LibrePods system-tray app for Windows — AirPods battery + ANC control via the LibrePodsAAP driver"

[dependencies]
tray-icon = "0.19"
# Battery-percentage tray icon rendering.
ab_glyph = "0.2"
image = { version = "0.25", default-features = false }
imageproc = "0.25"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_System_Registry",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Bluetooth",
    "Win32_UI_WindowsAndMessaging",
    "Win32_Graphics_Gdi",
    "Win32_Graphics_Dwm",
    "Win32_System_LibraryLoader",
] }
# `windows` (full COM/WinRT) for Core Audio volume control + SMTC media control.
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
    "Foundation",       # IAsyncOperation::get() for the WinRT SMTC calls
    "Media_Control",    # GlobalSystemMediaTransportControlsSession* (auto-pause)
] }

[build-dependencies]
cc = "1"

[[bin]]
name = "librepods-tray"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
