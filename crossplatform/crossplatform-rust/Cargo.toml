[package]
name = "librepods"
version = "0.1.0"
edition = "2024"

[dependencies]
tokio = {version = "1.50.0", features = ["full"]}
env_logger = {version = "0.11.10", features = ["auto-color"]}
uuid = "1.23.0"
log = "0.4.29"
hex = "0.4.3"
iced = { version = "0.14.0", features = ["tokio", "image"] }
image = "0.25.8"
imageproc = "0.26.1"
ab_glyph = "0.2.32"
clap = { version = "4.6.0", features = ["derive"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
aes = "0.9.0-rc.4"
futures = "0.3.32"
async-trait = "0.1"

# Linux-only backend dependencies (platform/linux/* + the ksni tray). These pull
# in native system libraries (BlueZ, libdbus, libpulse) and are not built on
# Windows, where platform/windows/* provides the backends instead.
[target.'cfg(target_os = "linux")'.dependencies]
bluer = { version = "0.17.4", features = ["full"] }
dbus = "0.9.10"
libpulse-binding = "2.30.1"
ksni = "0.3.1"

# Windows-only backend dependencies (platform/windows/*). Not built on Linux.
[target.'cfg(target_os = "windows")'.dependencies]
directories = "6"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
] }
# Full COM/WinRT: SMTC media control + Core Audio (WASAPI) volume + WinRT
# Bluetooth (LE advertisement watcher, adapter address).
windows = { version = "0.58", features = [
    "Foundation",
    "Foundation_Collections",
    "Media_Control",
    "Devices_Bluetooth",
    "Devices_Bluetooth_Advertisement",
    "Storage_Streams",
    "Win32_System_Com",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_Foundation",
] }

[profile.release]
opt-level = "s"
lto = true
codegen-units = 8
panic = "abort"
strip = true
