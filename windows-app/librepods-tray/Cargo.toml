[package]
name = "librepods-tray"
version = "0.1.0"
edition = "2021"
description = "LibrePods system-tray app for Windows — AirPods battery + ANC control via the LibrePodsAAP driver"

[dependencies]
tray-icon = "0.19"
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Bluetooth",
    "Win32_UI_WindowsAndMessaging",
] }

[[bin]]
name = "librepods-tray"
path = "src/main.rs"

[profile.release]
opt-level = "s"
lto = true
strip = true
