[package]
name = "librepods-ui"
version = "0.1.0"
edition = "2021"
description = "LibrePods egui window for Windows — battery, ANC and a volume slider"

[dependencies]
eframe = { version = "0.29", default-features = false, features = ["glow", "default_fonts"] }
windows-sys = { version = "0.59", features = [
    "Win32_Foundation",
    "Win32_System_IO",
    "Win32_Storage_FileSystem",
    "Win32_Security",
    "Win32_Devices_DeviceAndDriverInstallation",
    "Win32_Devices_Bluetooth",
] }
windows = { version = "0.58", features = [
    "Win32_Foundation",
    "Win32_Media_Audio",
    "Win32_Media_Audio_Endpoints",
    "Win32_System_Com",
] }

[[bin]]
name = "librepods-ui"
path = "src/main.rs"

[profile.release]
opt-level = "s"
